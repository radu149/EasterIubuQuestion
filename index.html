<!DOCTYPE html> <html lang="ro"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Întrebare de Paște 🐰</title> <style> body{ font-family: Arial, sans-serif; background: linear-gradient(135deg,#ffd6e7,#fff5c3); height:100vh; display:flex; justify-content:center; align-items:center; text-align:center; overflow:hidden; margin:0; } .container{ background:white; padding:40px; border-radius:25px; box-shadow:0 15px 40px rgba(0,0,0,0.2); max-width:350px; width:90%; z-index:10; position:relative; } .bunny{ font-size:70px; animation:jump 1.5s infinite; } @keyframes jump{ 0%{transform:translateY(0)} 50%{transform:translateY(-20px)} 100%{transform:translateY(0)} } #question{ font-size:22px; margin-top:10px; } .buttons{ margin-top:30px; position:relative; height:140px; } button{ font-size:18px; padding:12px 25px; border:none; border-radius:12px; cursor:pointer; position:absolute; } #yes{ background:#7be495; left:25%; } #no{ background:#ff8fa3; left:55%; } .confetti{ position:absolute; font-size:25px; animation:fall linear infinite; } @keyframes fall{ 0%{ transform:translateY(-120vh); } 100%{ transform:translateY(110vh); } } </style> </head> <body> <div class="container"> <div class="bunny">🐰</div> <h2 id="question">Vrei să fii iepurașul meu de Paște? 🥚</h2> <div class="buttons"> <button id="yes">DA 💛</button> <button id="no">NU 😢</button> </div> </div> <script> const noBtn = document.getElementById("no"); const question = document.getElementById("question"); const messages = [ "Ești sigură? 🥺", "Gândește-te bine...", "Dar am ouă de ciocolată 🍫🥚", "Vopsim oua impreuna!", "Voi fi trist 💔", "Nu face asta 😭", "Chiar nu vrei?", "Te roooooooog", "Do you even love me?", "I know you do XOXO", "Ultima șansă!" ]; let index = 0; function moveButton(){ let x = Math.random()*200-100; let y = Math.random()*150-75; noBtn.style.transform=`translate(${x}px,${y}px)`; if(index < messages.length){ question.innerText = messages[index]; index++; } } noBtn.addEventListener("mouseover", moveButton); noBtn.addEventListener("click", moveButton); document.getElementById("yes").addEventListener("click", ()=>{ document.querySelector(".container").innerHTML = "<h1>YAYYYY 🐰💛</h1><p>Acum ești oficial iepurașul meu de Paște! 🥚✨</p>"; for(let i=0;i<40;i++){ let conf=document.createElement("div"); conf.className="confetti"; const emojis=["🥚","🐰","💛","🌸","✨"]; conf.innerText=emojis[Math.floor(Math.random()*emojis.length)]; conf.style.left=Math.random()*100+"vw"; conf.style.top="-50px"; conf.style.animationDuration=2+Math.random()*3+"s"; document.body.appendChild(conf); } }); </script> </body> </html>
